name: Postman CI

# Run the committed PokéAPI Postman collection against the public PokéAPI.
# No Postman API key / secret is needed: the collection file runs directly.
# Triggers:
#  - pull_request into main is the pre-merge quality gate.
#  - push scoped to main verifies the post-merge default-branch state without
#    re-running on every feature-branch push. A bare 'push:' previously caused a
#    duplicate run per PR update: once for the branch push, once for the PR sync.
#  - workflow_dispatch keeps manual on-demand reruns available.
#  - schedule (daily at 06:00 UTC) catches drift in the live public PokéAPI, which
#    is the system under test and can change with no commit. One run per day
#    respects the repo's low-request-volume, fair-use posture.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

# Token permissions:
#  - contents: write  -> the trend step pushes a data point to the gh-pages branch
#  - checks:   write  -> dorny/test-reporter publishes a per-run check/report
#  - pages:    write  -> the deploy job publishes the site via GitHub Pages
#  - id-token: write  -> required by actions/deploy-pages (OIDC) to deploy
permissions:
  contents: write
  checks: write
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; let a run in progress finish so a
# deployment is never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-collection:
    name: Run PokéAPI collection with Newman
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA (v4.2.2) for reproducibility.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned by commit SHA (v4.1.0). Node 22 LTS.
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      # Pin the exact Newman version so CI is reproducible. Newman is Postman's
      # officially maintained command-line Collection Runner, used here because
      # it emits the JUnit XML + JSON reports the downstream steps consume.
      # The htmlextra reporter produces a rich, standalone HTML report that is
      # published to the gh-pages root so the bare Pages URL shows the latest
      # test results.
      - name: Install Newman (pinned)
        run: npm install -g newman@6.2.3 newman-reporter-htmlextra@1.23.1

      # Same command + reporters as the local run. The CLI reporter only writes
      # to stdout, so stdout is teed into reports/pokeapi.cli.txt to capture the
      # third report form. 'set -o pipefail' makes the pipeline return Newman's
      # exit code (not tee's), so any failed request or assertion still fails the
      # job; the exit code is NOT swallowed.
      - name: Run collection
        shell: bash
        run: |
          set -o pipefail
          newman run postman/pokeapi.postman_collection.json \
            --reporters cli,junit,json,htmlextra \
            --reporter-junit-export reports/pokeapi.junit.xml \
            --reporter-json-export reports/pokeapi.results.json \
            --reporter-htmlextra-export reports/pokeapi.report.html \
            --reporter-htmlextra-title "PokéAPI CI results" \
            --reporter-htmlextra-browserTitle "PokéAPI CI results" \
            | tee reports/pokeapi.cli.txt

      # Additive job summary. This is a SEPARATE step from 'Run collection' so
      # it never alters or swallows that step's exit code: a failed assertion
      # still fails the job via 'Run collection'. if: always() so a red run
      # still gets a summary. It only reads the named report files and only
      # writes to $GITHUB_STEP_SUMMARY; it never dumps the environment or any
      # secret. Parse errors are tolerated so this step does not fail the job.
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          set +e
          JUNIT="reports/pokeapi.junit.xml"
          JSON="reports/pokeapi.results.json"
          node --input-type=module - "$JUNIT" "$JSON" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import { readFileSync } from 'node:fs';

          const junitPath = process.argv[2];
          const jsonPath = process.argv[3];
          const out = [];
          out.push('## PokeAPI Newman results');

          function fromJunit(xml) {
            // Aggregate counts across all <testsuite .../> elements.
            let tests = 0, failures = 0, errors = 0;
            const suiteRe = /<testsuite\b[^>]*>/g;
            let m;
            while ((m = suiteRe.exec(xml)) !== null) {
              const tag = m[0];
              const t = /\btests="(\d+)"/.exec(tag);
              const f = /\bfailures="(\d+)"/.exec(tag);
              const e = /\berrors="(\d+)"/.exec(tag);
              if (t) tests += Number(t[1]);
              if (f) failures += Number(f[1]);
              if (e) errors += Number(e[1]);
            }
            // Collect names of failing testcases for a short list. Match both
            // self-closing <testcase .../> and <testcase ...>...</testcase>;
            // only paired testcases can contain <failure>/<error> children.
            const failed = [];
            const caseRe = /<testcase\b([^>]*?)(\/>|>([\s\S]*?)<\/testcase>)/g;
            let c;
            while ((c = caseRe.exec(xml)) !== null) {
              const attrs = c[1];
              const body = c[3] || '';
              if (/<failure\b/.test(body) || /<error\b/.test(body)) {
                const nm = /\bname="([^"]*)"/.exec(attrs);
                failed.push(nm ? nm[1] : '(unnamed)');
              }
            }
            return { assertions: tests, failures: failures + errors, failed };
          }

          function fromJson(txt) {
            const data = JSON.parse(txt);
            const run = (data && data.run) || {};
            const stats = run.stats || {};
            const requests = (stats.requests && stats.requests.total) || 0;
            const assertions = (stats.assertions && stats.assertions.total) || 0;
            const failures = (stats.assertions && stats.assertions.failed) || 0;
            const failed = (run.failures || []).map((x) => {
              const name = x && x.error && x.error.test ? x.error.test
                : (x && x.source && x.source.name ? x.source.name : '(unnamed)');
              return name;
            });
            return { requests, assertions, failures, failed };
          }

          let summary = null;
          let source = null;
          try {
            const xml = readFileSync(junitPath, 'utf8');
            summary = fromJunit(xml);
            source = junitPath;
          } catch (_) {
            try {
              const txt = readFileSync(jsonPath, 'utf8');
              summary = fromJson(txt);
              source = jsonPath;
            } catch (_2) {
              summary = null;
            }
          }

          if (!summary) {
            out.push('');
            out.push('No report found (reports/pokeapi.junit.xml and reports/pokeapi.results.json were missing or unreadable).');
            process.stdout.write(out.join('\n') + '\n');
          } else {
            out.push('');
            out.push('| Metric | Count |');
            out.push('| --- | --- |');
            if (summary.requests !== undefined) out.push(`| Requests | ${summary.requests} |`);
            out.push(`| Assertions | ${summary.assertions ?? 0} |`);
            out.push(`| Failures | ${summary.failures ?? 0} |`);
            if (summary.failed && summary.failed.length) {
              out.push('');
              out.push('### Failed assertions');
              for (const name of summary.failed.slice(0, 25)) {
                out.push(`- ${name}`);
              }
              if (summary.failed.length > 25) {
                out.push(`- ...and ${summary.failed.length - 25} more`);
              }
            }
            out.push('');
            out.push(`_Source: ${source}_`);
            process.stdout.write(out.join('\n') + '\n');
          }
          EOF
          # Never let a parse/summary problem fail the job: the authoritative
          # pass/fail is the separate 'Run collection' step.
          exit 0

      # Upload reports even when the run step fails (if: always()).
      # Pinned by commit SHA (v4.4.3).
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pokeapi-reports
          path: |
            reports/pokeapi.cli.txt
            reports/pokeapi.junit.xml
            reports/pokeapi.results.json
            reports/pokeapi.report.html
          if-no-files-found: warn

      # Per-run readable report: parse the JUnit XML and publish it as a check
      # so pass/fail per request is visible in the Actions UI without downloading
      # the artifact. Runs even on failure. Pinned by commit SHA (v1.9.1).
      # Skipped for pull requests from a fork: the token is read-only there even
      # though the workflow requests checks: write, so creating the check run
      # fails with an authorization error that fail-on-error does not suppress and
      # would turn an otherwise-green run red. Still runs for same-repo PRs,
      # pushes, schedule, and manual dispatch.
      - name: Publish per-run test report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
        with:
          name: PokéAPI test results
          path: reports/pokeapi.junit.xml
          reporter: java-junit
          fail-on-error: false

      # Extract trend metrics from the Newman JSON report and write a run summary
      # table to the Actions run page. Runs even on failure so a failing run still
      # contributes a data point to the trend.
      - name: Extract trend metrics
        if: always()
        run: node scripts/newman-trend-metrics.js reports/pokeapi.results.json reports/trend-metrics.json

      # Append this run's metrics to a time series stored on the gh-pages branch
      # and render a chart. Only on pushes to the default branch, so PRs and
      # feature branches do not pollute the published trend. Pinned by SHA (v1.20.4).
      - name: Update test trend
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@d48d326b4ca9ba73ca0cd0d59f108f9e02a381c7 # v1.20.4
        with:
          name: PokéAPI collection trend
          tool: customSmallerIsBetter
          output-file-path: reports/trend-metrics.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: trend
          # Mark a run as an alert if any metric regresses sharply vs. the
          # previous data point (e.g. new failures, or response time doubling).
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false

      # Hand the htmlextra report to the deploy job as an artifact. The deploy
      # job (below) assembles it with the trend data and publishes via the
      # official GitHub Pages deployment, which — unlike a GITHUB_TOKEN push to
      # a branch — reliably triggers a Pages deployment. Runs even on failure so
      # a red run still publishes its report. Pinned by SHA (v4.4.3).
      - name: Upload report for Pages deploy
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pokeapi-html-report
          path: reports/pokeapi.report.html
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Deploy the public Pages site via the official Actions deployment (not a
  # branch push). GitHub's branch-based publishing does NOT rebuild when the
  # commit is pushed with GITHUB_TOKEN, so the site is deployed here instead.
  #
  # The site is assembled fresh each run:
  #   /                     -> the TREND CHART (landing page). Clicking a point
  #                            opens that run's archived htmlextra report.
  #   /report/              -> the latest run's htmlextra report
  #   /reports/<sha>.html   -> per-run archived reports (one per main run)
  #   /trend/               -> the trend chart again, kept for back-compat
  #
  # Per-run reports are archived on the gh-pages branch under reports/, so they
  # persist across runs (GitHub Actions is stateless). The chart's built-in
  # onClick normally opens the commit URL; a post-process step rewrites it to
  # open /reports/<sha>.html when an archived report exists for that commit,
  # falling back to the commit URL otherwise (e.g. historical points).
  #
  # Gated to pushes on main. Needs the run-collection job (and its trend step)
  # to finish first so gh-pages holds the newest data point.
  # ---------------------------------------------------------------------------
  deploy-pages:
    name: Deploy Pages site
    needs: run-collection
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out the source repo (for scripts/link-chart-to-reports.js). This
      # job is separate from run-collection, so it needs its own source checkout;
      # it lands in the default workspace while gh-pages goes under ghpages/.
      # Pinned by SHA (v4.2.2).
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Check out the gh-pages branch (the data store: trend + archived reports)
      # into ./ghpages, keeping credentials so we can push the archive back.
      # Pinned by SHA (v4.2.2).
      - name: Checkout gh-pages (data store)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: gh-pages
          path: ghpages

      # Download the htmlextra report produced by run-collection.
      # Pinned by SHA (v4.1.8).
      - name: Download HTML report
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: pokeapi-html-report
          path: downloaded-report
        continue-on-error: true

      # Archive this run's report on gh-pages as reports/<sha>.html so the trend
      # point for this commit has a stable report URL to link to. Commit + push
      # with a small retry in case the benchmark action moved gh-pages meanwhile.
      - name: Archive report on gh-pages
        if: hashFiles('downloaded-report/pokeapi.report.html') != ''
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C ghpages config user.name "github-actions[bot]"
          git -C ghpages config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git -C ghpages fetch origin gh-pages
            git -C ghpages reset --hard origin/gh-pages
            mkdir -p ghpages/reports
            cp downloaded-report/pokeapi.report.html "ghpages/reports/${SHA}.html"
            git -C ghpages add "reports/${SHA}.html"
            if git -C ghpages diff --cached --quiet; then
              echo "Report for ${SHA} already archived."
              break
            fi
            git -C ghpages commit -m "Archive test report for ${SHA}"
            if git -C ghpages push origin HEAD:gh-pages; then
              echo "Archived report on attempt ${attempt}."
              break
            fi
            echo "Push rejected (gh-pages moved); retry ${attempt}/3..."
            sleep 3
          done

      # Assemble the site: trend chart at root (with click targets rewritten to
      # per-run reports), latest report at /report/, all archived reports at
      # /reports/, and the chart again at /trend/ for back-compat.
      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site site/report site/reports site/trend
          # .nojekyll so GitHub serves files as-is (no Jekyll processing).
          touch site/.nojekyll

          # Trend chart -> root and /trend/.
          if [ -d ghpages/trend ]; then
            cp -R ghpages/trend/. site/trend/
            cp -R ghpages/trend/. site/
          fi

          # All archived per-run reports -> /reports/.
          if [ -d ghpages/reports ]; then
            cp -R ghpages/reports/. site/reports/
          fi

          # Latest report -> /report/index.html (convenience, always current run).
          if [ -f downloaded-report/pokeapi.report.html ]; then
            cp downloaded-report/pokeapi.report.html site/report/index.html
          else
            echo '<!doctype html><title>No report</title><p>No report for this run. See the <a href="../">trend chart</a>.</p>' > site/report/index.html
          fi

          # Rewrite the click handler in BOTH chart copies so a data point opens
          # that run's archived report when it exists, else the commit URL.
          #  - root chart (site/index.html): reports live at ./reports/
          #  - /trend/ chart (site/trend/index.html): one level deeper, so the
          #    shared archive is at ../reports/
          if [ -f site/index.html ]; then
            node scripts/link-chart-to-reports.js site/index.html site/reports './reports/'
          fi
          if [ -f site/trend/index.html ]; then
            node scripts/link-chart-to-reports.js site/trend/index.html site/reports '../reports/'
          fi

          echo "Assembled site:"; find site -maxdepth 2 -type f | sort

      # Configure Pages (switches the repo's build type to "workflow" if needed).
      # Pinned by SHA (v6.0.0).
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Package ./site as the Pages artifact. Pinned by SHA (v5.0.0).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # Deploy the artifact. This reliably triggers a Pages deployment.
      # Pinned by SHA (v5.0.1).
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
