name: Postman CI

# Run the committed PokéAPI Postman collection against the public PokéAPI.
# No Postman API key / secret is needed: the collection file runs directly.
on:
  push:
  pull_request:
  workflow_dispatch:

# Minimal token permissions: the job only needs to read the repository.
permissions:
  contents: read

jobs:
  run-collection:
    name: Run PokéAPI collection with Newman
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA (v4.2.2) for reproducibility.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned by commit SHA (v4.1.0). Node 22 LTS.
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      # Pin the exact Newman version so CI is reproducible.
      # Newman is Postman's officially maintained command-line Collection Runner
      # and is used here (instead of postman-cli) because it is the tool that
      # emits JUnit XML + JSON reports, matching the verified local run.
      - name: Install Newman (pinned)
        run: npm install -g newman@6.2.3

      # Same command + reporters as the local run. The CLI reporter only writes
      # to stdout, so stdout is teed into reports/pokeapi.cli.txt to capture the
      # third report form. 'set -o pipefail' makes the pipeline return Newman's
      # exit code (not tee's), so any failed request or assertion still fails the
      # job; the exit code is NOT swallowed.
      - name: Run collection
        shell: bash
        run: |
          set -o pipefail
          newman run postman/pokeapi.postman_collection.json \
            --reporters cli,junit,json \
            --reporter-junit-export reports/pokeapi.junit.xml \
            --reporter-json-export reports/pokeapi.results.json \
            | tee reports/pokeapi.cli.txt

      # Additive job summary. This is a SEPARATE step from 'Run collection' so
      # it never alters or swallows that step's exit code: a failed assertion
      # still fails the job via 'Run collection'. if: always() so a red run
      # still gets a summary. It only reads the named report files and only
      # writes to $GITHUB_STEP_SUMMARY; it never dumps the environment or any
      # secret. Parse errors are tolerated so this step does not fail the job.
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          set +e
          JUNIT="reports/pokeapi.junit.xml"
          JSON="reports/pokeapi.results.json"
          node --input-type=module - "$JUNIT" "$JSON" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import { readFileSync } from 'node:fs';

          const junitPath = process.argv[2];
          const jsonPath = process.argv[3];
          const out = [];
          out.push('## PokeAPI Newman results');

          function fromJunit(xml) {
            // Aggregate counts across all <testsuite .../> elements.
            let tests = 0, failures = 0, errors = 0;
            const suiteRe = /<testsuite\b[^>]*>/g;
            let m;
            while ((m = suiteRe.exec(xml)) !== null) {
              const tag = m[0];
              const t = /\btests="(\d+)"/.exec(tag);
              const f = /\bfailures="(\d+)"/.exec(tag);
              const e = /\berrors="(\d+)"/.exec(tag);
              if (t) tests += Number(t[1]);
              if (f) failures += Number(f[1]);
              if (e) errors += Number(e[1]);
            }
            // Collect names of failing testcases for a short list. Match both
            // self-closing <testcase .../> and <testcase ...>...</testcase>;
            // only paired testcases can contain <failure>/<error> children.
            const failed = [];
            const caseRe = /<testcase\b([^>]*?)(\/>|>([\s\S]*?)<\/testcase>)/g;
            let c;
            while ((c = caseRe.exec(xml)) !== null) {
              const attrs = c[1];
              const body = c[3] || '';
              if (/<failure\b/.test(body) || /<error\b/.test(body)) {
                const nm = /\bname="([^"]*)"/.exec(attrs);
                failed.push(nm ? nm[1] : '(unnamed)');
              }
            }
            return { assertions: tests, failures: failures + errors, failed };
          }

          function fromJson(txt) {
            const data = JSON.parse(txt);
            const run = (data && data.run) || {};
            const stats = run.stats || {};
            const requests = (stats.requests && stats.requests.total) || 0;
            const assertions = (stats.assertions && stats.assertions.total) || 0;
            const failures = (stats.assertions && stats.assertions.failed) || 0;
            const failed = (run.failures || []).map((x) => {
              const name = x && x.error && x.error.test ? x.error.test
                : (x && x.source && x.source.name ? x.source.name : '(unnamed)');
              return name;
            });
            return { requests, assertions, failures, failed };
          }

          let summary = null;
          let source = null;
          try {
            const xml = readFileSync(junitPath, 'utf8');
            summary = fromJunit(xml);
            source = junitPath;
          } catch (_) {
            try {
              const txt = readFileSync(jsonPath, 'utf8');
              summary = fromJson(txt);
              source = jsonPath;
            } catch (_2) {
              summary = null;
            }
          }

          if (!summary) {
            out.push('');
            out.push('No report found (reports/pokeapi.junit.xml and reports/pokeapi.results.json were missing or unreadable).');
            process.stdout.write(out.join('\n') + '\n');
          } else {
            out.push('');
            out.push('| Metric | Count |');
            out.push('| --- | --- |');
            if (summary.requests !== undefined) out.push(`| Requests | ${summary.requests} |`);
            out.push(`| Assertions | ${summary.assertions ?? 0} |`);
            out.push(`| Failures | ${summary.failures ?? 0} |`);
            if (summary.failed && summary.failed.length) {
              out.push('');
              out.push('### Failed assertions');
              for (const name of summary.failed.slice(0, 25)) {
                out.push(`- ${name}`);
              }
              if (summary.failed.length > 25) {
                out.push(`- ...and ${summary.failed.length - 25} more`);
              }
            }
            out.push('');
            out.push(`_Source: ${source}_`);
            process.stdout.write(out.join('\n') + '\n');
          }
          EOF
          # Never let a parse/summary problem fail the job: the authoritative
          # pass/fail is the separate 'Run collection' step.
          exit 0

      # Upload reports even when the run step fails (if: always()).
      # Pinned by commit SHA (v4.4.3).
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pokeapi-reports
          path: |
            reports/pokeapi.cli.txt
            reports/pokeapi.junit.xml
            reports/pokeapi.results.json
          if-no-files-found: warn
